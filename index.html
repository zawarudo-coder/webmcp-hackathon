<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinCanvas — WebMCP Analyst Co-Pilot</title>
  <meta name="description" content="Collaborative canvas where humans and AI agents co-analyze public-company financials. WebMCP powered." />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo"><span class="dot"></span> FinCanvas</div>
    <span class="tagline">WebMCP analyst co-pilot · human + AI co-analysis of public-company financials</span>
  </header>

  <main>
    <section class="canvas-area">
      <svg id="canvas" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
    </section>

    <aside class="sidebar">
      <h2>🔧 Tools</h2>
      <ul id="tool-list"></ul>
      <h3>💼 Companies</h3>
      <ul id="company-list"></ul>
      <h3>📊 Ratios</h3>
      <ul id="ratio-list"></ul>
      <h3>💬 Console</h3>
      <pre id="log"></pre>
    </aside>
  </main>

  <footer>
    <small>WebMCP Challenge · FinCanvas · MIT · <a href="https://github.com/zawarudo-coder/webmcp-hackathon">GitHub</a></small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
